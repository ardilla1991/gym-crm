# PostgreSQL from docker-compose.yml (docker compose up -d), profile "postgres".
# Persistent database: the data survives restarts. Hibernate only checks that the tables match the entities.
# First start on an empty database: --spring.jpa.hibernate.ddl-auto=create creates the tables and loads data.sql
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gym_crm
    username: gym
    password: gym
  jpa:
    hibernate:
      ddl-auto: validate
