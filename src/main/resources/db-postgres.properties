# PostgreSQL from docker-compose.yml (docker compose up -d).
# For a local PostgreSQL pass your own credentials: -Ddb.username=... -Ddb.password=...
db.url=jdbc:postgresql://localhost:5432/gym_crm
db.username=gym
db.password=gym
# Persistent database: the data survives restarts. Hibernate only checks that the tables match the entities.
# First start on an empty database: -Ddb.schema=create creates the tables and loads data.sql
db.schema=validate
