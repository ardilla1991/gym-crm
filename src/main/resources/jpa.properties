# hibernate.hbm2ddl.auto depends on the database: db.schema in db-h2.properties / db-postgres.properties
# SQL is logged by the org.hibernate.SQL logger (see logback.xml), not printed to System.out,
# so each statement gets the transactionId of the REST call
hibernate.show_sql=false
# One line per statement: every line of the log then has the transactionId and is found by it
hibernate.format_sql=false
# Initial data, executed right after the tables are created (runs only when the schema is created)
jakarta.persistence.sql-load-script-source=db/data.sql