# Development: PostgreSQL from docker-compose.yml.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gym_crm}
    username: ${DB_USERNAME:gym}
    password: ${DB_PASSWORD:gym}
  jpa:
    hibernate:
      ddl-auto: update
logging:
  level:
    com.epam.training.gym: DEBUG
    org.hibernate.SQL: DEBUG
