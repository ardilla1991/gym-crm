# H2 in-memory database: works without any installation.
# DB_CLOSE_DELAY=-1 keeps the database alive while the application is running.
db.url=jdbc:h2:mem:gym_crm;DB_CLOSE_DELAY=-1
db.username=sa
db.password=
# Temporary in-memory database: tables and data.sql are created on every start
db.schema=create
