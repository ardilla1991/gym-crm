# Hibernate settings for DAO tests
# Create tables at startup and drop them at the end
hibernate.hbm2ddl.auto=create-drop
# Print generated SQL
hibernate.show_sql=true
hibernate.format_sql=true
# Reference data executed after the tables are created
jakarta.persistence.sql-load-script-source=db/test-data.sql
# Count executed SQL statements: used by tests that check the number of queries
hibernate.generate_statistics=true