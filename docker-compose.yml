# Optional: run PostgreSQL for the application (by default the app uses H2).
# Start: docker compose up -d     
# Stop: docker compose down

# DB http://localhost:5432
services:
  postgres:
    image: postgres:17
    container_name: gym-crm-postgres
    environment:
      POSTGRES_DB: gym_crm
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    ports:
      - "5432:5432"
    volumes:
      - gym-crm-data:/var/lib/postgresql/data

volumes:
  gym-crm-data: