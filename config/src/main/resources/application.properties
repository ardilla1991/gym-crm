# Initialize storage with some prepared data from the file
# during the application startup.
# "classpath:" = look next to the compiled classes (src/main/resources ends up there).
# To use a file outside the project, write e.g. file:C:/gym/data/trainees.json
storage.init.trainee=classpath:data/trainees.json
storage.init.trainer=classpath:data/trainers.json
storage.init.training=classpath:data/trainings.json
storage.init.training-type=classpath:data/training-types.json